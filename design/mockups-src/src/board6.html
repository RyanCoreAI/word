<!doctype html>
<html lang="zh"><head>{{head}}</head>
<body>
<div class="board">
  <div class="board-head">
    <div class="kicker">原型 V1 · 补充页面 · 6 / 6</div>
    <h1>官网 yanxai.com · 注销账号页 · App 图标</h1>
    <p>官网只做三件事：介绍、下载（App Store / 安卓 APK）、放法律页面。隐私政策、用户协议、注销账号这三个网址是上架苹果和谷歌必须填的。</p>
  </div>
  <div class="row" style="gap:48px">
    <figure>
      <div class="label"><span class="num">1</span>官网首页（电脑）</div>
      <div class="browser">
        <div class="chrome"><i></i><i></i><i></i><span class="url">{{i:lock}}yanxai.com</span></div>
        <div class="site">
          <div class="nav"><span class="brand"><span class="mk">词</span>背单词</span><span>功能</span><span>下载</span><span>隐私政策</span><span>帮助</span></div>
          <div class="heroW">
            <div class="txt">
              <h1>每天几组，<br>把单词真正记住</h1>
              <p>看单词、听发音，点「认识」或「不认识」。不认识的词会在下一组再出现，直到你认识两次为止。四六级、考研、托福、雅思、GRE 共 11,481 个词。</p>
              <div class="dl">
                <span class="ios">{{i:smartphone}}<span>App Store<small>iPhone · iOS 16+</small></span></span>
                <span class="and">{{i:download}}<span>安卓下载<small>APK · Android 8+</small></span></span>
              </div>
            </div>
            <div style="width:300px;display:flex;justify-content:center">
              <div class="mini-phone"><div class="phone"><div class="screen">
                <div class="island"></div><div class="status"><span>9:41</span><span class="sys"><span class="bat"><i></i></span></span></div>
                <div class="topbar"><button class="icon-btn">{{i:chevron-left}}</button><div class="tb-title"><div class="t1">看词记忆</div><div class="t2">第 3 组 · 新词 14 · 复习 6</div></div><button class="icon-btn">{{i:settings}}</button></div>
                <div class="prog"><div class="prog-meta"><span><b>8</b> / 20</span><span><em class="g">认识 5</em><em class="r">不认识 2</em></span></div>{{segs:ggrggrgcxxxxxxxxxxxx}}</div>
                <div class="stage"><div class="card">
                  <div class="chips"><span class="chip">四级</span><span class="chip">六级</span><span class="chip">考研</span></div>
                  <div class="word-zone"><div class="word">elaborate</div><div class="phon"><span class="acc-tag">美</span>/ɪˈlæbrət/<span class="spk on">{{i:volume-2}}</span></div></div>
                  <div class="mask">{{i:eye-off}}<div class="m1">词性和中文已遮住</div></div>
                </div></div>
                <div class="actions"><button class="btn bad">{{i:x}}不认识</button><button class="btn good">{{i:check}}认识</button></div>
                <div class="hint">&nbsp;</div>
              </div></div></div>
            </div>
          </div>
          <div class="feat">
            <div><span class="mi">{{i:book-open}}</span><h5>看词记忆</h5><p>单词出现就自动朗读，词性和中文先遮住，不认识再看。</p></div>
            <div><span class="mi">{{i:headphones}}</span><h5>听音辨词</h5><p>只听发音不看拼写，练的是真正听得懂。</p></div>
            <div><span class="mi">{{i:repeat}}</span><h5>不认识就反复出现</h5><p>每个词记下不认识的次数，认识两次才算掌握。</p></div>
          </div>
          <div class="foot"><span>隐私政策</span><span>用户协议</span><span>注销账号</span><span>联系：support@yanxai.com</span><span>© 2026 yanxai.com</span></div>
        </div>
      </div>
    </figure>

    <figure class="shot">
      <div class="label"><span class="num">2</span>yanxai.com/delete-account</div>
      <div class="phone"><div class="screen">
        {{status}}
        <div class="page doc" style="gap:14px;padding-top:16px">
          <span class="brand" style="margin:0"><span class="mk">词</span>背单词</span>
          <h3>注销账号并删除数据</h3>
          <p>注销后，我们会在 <b>7 天内</b>删除服务器上与你账号有关的全部数据（学习进度、答题记录、邮箱），无法恢复。</p>
          <div class="sub-h" style="margin:0">方式一：在 App 里</div>
          <ol><li>打开「设置」→「账号与数据」</li><li>点「注销账号」，确认两次</li></ol>
          <div class="sub-h" style="margin:0">方式二：在这里申请</div>
          <div class="field">{{i:mail}}<span style="color:var(--ink-3)">绑定的邮箱</span></div>
          <button class="btn dark" style="flex:none;height:54px;font-size:16px">发送验证码并注销</button>
          <p style="font-size:12.5px;color:var(--ink-3)">没有绑定邮箱的匿名账号只能在 App 里注销。问题请联系 support@yanxai.com</p>
        </div>
        <div class="home-ind"></div>
      </div></div>
      <ul class="notes">
        <li>谷歌要求：<b>App 外</b>也必须能申请删除账号</li>
        <li>隐私政策、用户协议页面同样的样式</li>
      </ul>
    </figure>

    <figure>
      <div class="label"><span class="num">3</span>App 图标（草案）</div>
      <div style="display:flex;flex-direction:column;gap:22px;align-items:flex-start">
        <div style="width:220px;height:220px;border-radius:50px;background:var(--accent);color:#fff;display:grid;place-items:center;font-size:118px;font-weight:700;position:relative;box-shadow:0 24px 40px -16px rgba(59,79,216,.6)">词<span style="position:absolute;right:36px;bottom:36px;width:34px;height:34px;border-radius:50%;background:#3DDC97"></span></div>
        <div style="display:flex;gap:16px;align-items:flex-end">
          <div class="app-mark" style="width:96px;height:96px;font-size:50px;border-radius:24px">词</div>
          <div class="app-mark" style="width:60px;height:60px;font-size:31px;border-radius:15px">词</div>
          <div class="app-mark" style="width:40px;height:40px;font-size:21px;border-radius:10px">词</div>
        </div>
      </div>
      <ul class="notes" style="width:240px">
        <li>蓝底白字「词」，绿点代表「认识」</li>
        <li>名字「背单词」是<b>暂定</b>，上架前要换一个不重名的</li>
      </ul>
    </figure>
  </div>
</div>
</body></html>
