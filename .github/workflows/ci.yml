name: Verify Word
on:
  workflow_dispatch:
  push:
    branches: [claude/word-app-mockups]
  pull_request:
permissions:
  contents: read
concurrency:
  group: word-pages-${{ github.ref }}
  cancel-in-progress: true
jobs:
  build:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v6
        with:
          node-version: '24'
          cache: npm
      - uses: actions/setup-python@v6
        with:
          python-version: '3.12'
      - run: npm ci
      - run: npm run lint
      - run: npm run typecheck
      - run: npm test
      - run: python -m unittest discover -s tools/pipeline -p 'test_*.py'
      - run: python tools/pipeline/build.py
      - run: sudo apt-get update && sudo apt-get install --yes ffmpeg
      - run: python -m venv work/piper-eval/venv
      - run: work/piper-eval/venv/bin/python -m pip install -r tools/audio/requirements.txt
      - run: work/piper-eval/venv/bin/python tools/audio/download.py
      - run: work/piper-eval/venv/bin/python -u tools/audio/build.py
      - run: work/piper-eval/venv/bin/python tools/audio/build.py --verify
      - run: npm run build
      - uses: actions/upload-artifact@v4
        with:
          name: word-static-site
          path: dist
          retention-days: 1
